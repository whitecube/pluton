# Publishes the package to npm and GitHub Packages when a release is created.
# npm authentication uses trusted publishing (OIDC): no npm token is stored in
# the repository. The trusted publisher is configured on npmjs.com for this
# exact workflow filename (npm-publish.yml).

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # Trusted publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm publish --access public

  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@whitecube'
          package-manager-cache: false
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
